[package]
name = "paylore-payroll"
version = "0.1.0"
description = "Paylore on-chain foundation program."
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "paylore_payroll"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
	'cfg(target_os, values("solana"))',
	'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug", "no-log-ix-name"))',
] }

[dependencies]
anchor-lang = { workspace = true }
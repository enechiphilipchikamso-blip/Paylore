name: CI

on:
  push:
    branches:
      - main
      - dev-main
  pull_request:
    branches:
      - main
      - dev-main

permissions:
  contents: read

concurrency:
  group: paylore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt,clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Browser smoke
        run: pnpm test:e2e

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor AVM
        shell: bash
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 1.2.0
          avm use 1.2.0

      - name: Report tool versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          anchor --version
          solana --version

      - name: Anchor build
        run: anchor build

      - name: Upload build and test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: |
            apps/web/.next/
            playwright-report/
            test-results/
            !test-results/**/*.webm
            test-results/verification.mp4
            target/deploy/*.so
            target/idl/
            target/types/
          if-no-files-found: ignore